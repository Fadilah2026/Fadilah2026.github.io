<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Sertifikat | Fadli</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(180deg, #02020f, #0a0a2e, #15104a, #05051a);
  background-attachment: fixed;
  color: #fff;
  min-height: 100vh;
  padding: 100px 20px 60px;
}

/* NAVBAR */
.navbar {
  position: fixed; top: 0; left: 0; width: 100%;
  padding: 14px 30px;
  background: rgba(10, 10, 35, 0.9);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,215,0,0.2);
  z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
}
.nav-brand {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem; font-weight: 900;
  color: #ffd700; text-decoration: none;
  display: flex; align-items: center; gap: 10px;
}
.nav-brand .avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: linear-gradient(135deg, #ffd700, #ff8c00);
  display: flex; align-items: center; justify-content: center;
  color: #05051a; font-weight: 900; font-size: 0.9rem;
}
.nav-menu { display: flex; list-style: none; gap: 6px; flex-wrap: wrap; }
.nav-menu li a {
  text-decoration: none; color: #e0e0ff;
  font-size: 0.8rem; font-weight: 500;
  padding: 8px 14px; border-radius: 50px;
  transition: all 0.3s;
  display: flex; align-items: center; gap: 6px;
}
.nav-menu li a:hover, .nav-menu li a.active {
  background: rgba(255,215,0,0.2);
  color: #ffd700;
}
.nav-menu li a i { font-size: 0.7rem; color: #ffd700; }

/* LANGIT */
.sky {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 60vh;
  z-index: -1; pointer-events: none; overflow: hidden;
}
.moon {
  position: absolute; top: 100px; right: 80px;
  width: 80px; height: 80px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fffbe6, #ffe9a8, #f5c75a);
  box-shadow: 0 0 60px rgba(255,215,0,0.7), 0 0 120px rgba(255,215,0,0.4);
  animation: moonGlow 5s ease-in-out infinite;
}
@keyframes moonGlow { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.star {
  position: absolute; background: #fff; border-radius: 50%;
  animation: twinkle ease-in-out infinite;
}
@keyframes twinkle {
  0%,100% { opacity: 0.2; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.3); }
}

/* GELOMBANG */
.waves {
  position: fixed; bottom: 0; left: 0;
  width: 100%; height: 200px;
  z-index: -1; pointer-events: none; overflow: hidden;
}
.waves svg {
  position: absolute; bottom: 0; left: 0;
  width: 200%; height: 100%;
}
.wave1 { animation: waveMove 12s linear infinite; fill: rgba(255,215,0,0.18); }
.wave2 { animation: waveMove 18s linear infinite reverse; fill: rgba(100,180,255,0.15); }
.wave3 { animation: waveMove 24s linear infinite; fill: rgba(180,100,255,0.12); }
@keyframes waveMove {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* KONTEN */
.container {
  max-width: 1000px;
  margin: 0 auto;
  text-align: center;
  position: relative;
  z-index: 5;
}
.icon-big { font-size: 4rem; margin-bottom: 15px; animation: floatIcon 4s ease-in-out infinite; }
@keyframes floatIcon {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}
.title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 900;
  background: linear-gradient(135deg, #fff, #ffd700, #ff8c00);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 10px;
  letter-spacing: 2px;
}
.subtitle {
  font-size: 1.1rem; color: #e0e0ff;
  letter-spacing: 4px; text-transform: uppercase;
  font-weight: 300; margin-bottom: 40px;
  font-family: 'Playfair Display', serif;
}

/* SLIDER */
.slider-box {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,215,0,0.35);
  border-radius: 25px;
  padding: 25px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 60px rgba(255,215,0,0.2);
}
.main-img {
  width: 100%; height: 480px;
  background: #0a0a20;
  border-radius: 18px;
  overflow: hidden;
  position: relative;
  border: 2px solid rgba(255,215,0,0.3);
}
.main-img img {
  width: 100%; height: 100%;
  object-fit: contain;
  transition: opacity 0.4s ease;
}
.main-img img.fade { opacity: 0; }

.arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 50px; height: 50px; border-radius: 50%;
  background: rgba(255,215,0,0.15);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,215,0,0.6);
  color: #ffd700; font-size: 1.2rem; cursor: pointer;
  transition: all 0.3s;
  display: flex; align-items: center; justify-content: center;
}
.arrow:hover { background: rgba(255,215,0,0.4); transform: translateY(-50%) scale(1.15); }
.arrow.prev { left: 15px; }
.arrow.next { right: 15px; }

.info {
  margin-top: 20px;
  padding: 20px 25px;
  background: rgba(255,215,0,0.06);
  border-radius: 16px;
  border-left: 4px solid #ffd700;
  text-align: left;
  min-height: 100px;
}
.info h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem; color: #ffd700;
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 10px;
}
.info h3 .num {
  background: linear-gradient(135deg, #ffd700, #ff8c00);
  color: #05051a; font-size: 0.75rem; font-weight: 700;
  padding: 3px 12px; border-radius: 50px;
  font-family: 'Poppins', sans-serif;
}
.info p { font-size: 0.9rem; color: #e0e0ff; line-height: 1.7; font-weight: 300; }

.counter {
  margin-top: 12px;
  font-family: 'Playfair Display', serif;
  color: rgba(255,215,0,0.8);
  letter-spacing: 3px;
}

.thumbs {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
  margin-top: 20px;
}
.thumb {
  aspect-ratio: 1;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  border: 2px solid rgba(255,215,0,0.2);
  transition: all 0.3s;
  background: #1a1a3a;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb:hover { transform: translateY(-4px) scale(1.05); border-color: rgba(255,215,0,0.7); }
.thumb.active {
  border-color: #ffd700;
  box-shadow: 0 0 25px rgba(255,215,0,0.8);
  transform: scale(1.05);
}

/* NAV BUTTONS */
.page-nav {
  display: flex; justify-content: center;
  gap: 20px; margin-top: 50px; flex-wrap: wrap;
}
.page-nav a {
  text-decoration: none; color: #ffd700;
  background: rgba(255,215,0,0.1);
  border: 1px solid rgba(255,215,0,0.5);
  padding: 12px 28px; border-radius: 50px;
  font-size: 0.9rem; font-weight: 600;
  display: flex; align-items: center; gap: 8px;
  transition: all 0.3s;
}
.page-nav a:hover {
  background: rgba(255,215,0,0.3);
  transform: translateY(-4px);
  color: #fff;
}

@media (max-width: 768px) {
  .navbar { padding: 12px 15px; }
  .nav-menu li a { padding: 6px 10px; font-size: 0.7rem; }
  .main-img { height: 300px; }
  .arrow { width: 42px; height: 42px; }
  .thumbs { grid-template-columns: repeat(4, 1fr); }
  .moon { width: 60px; height: 60px; top: 80px; right: 30px; }
}
</style>
</head>
<body>

<!-- LANGIT -->
<div class="sky" id="sky">
  <div class="moon"></div>
</div>

<!-- GELOMBANG -->
<div class="waves">
  <svg viewBox="0 0 1440 220" preserveAspectRatio="none">
    <path class="wave1" d="M0,120 C240,180 480,60 720,120 C960,180 1200,60 1440,120 L1440,220 L0,220 Z"/>
  </svg>
  <svg viewBox="0 0 1440 220" preserveAspectRatio="none">
    <path class="wave2" d="M0,140 C300,80 600,200 900,140 C1200,80 1350,180 1440,140 L1440,220 L0,220 Z"/>
  </svg>
  <svg viewBox="0 0 1440 220" preserveAspectRatio="none">
    <path class="wave3" d="M0,160 C360,120 720,200 1080,160 C1260,140 1380,170 1440,160 L1440,220 L0,220 Z"/>
  </svg>
</div>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="index.html" class="nav-brand">
    <div class="avatar">MF</div>
    <span>Fadli Fadilah</span>
  </a>
  <ul class="nav-menu">
    <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
    <li><a href="profil.html"><i class="fas fa-user"></i> Profil</a></li>
    <li><a href="hobi.html"><i class="fas fa-futbol"></i> Hobi</a></li>
    <li><a href="kerja.html"><i class="fas fa-briefcase"></i> Kerja TKJ</a></li>
    <li><a href="passion.html"><i class="fas fa-rocket"></i> Passion</a></li>
    <li><a href="motto.html"><i class="fas fa-star"></i> Motto</a></li>
    <li><a href="sertifikat.html" class="active"><i class="fas fa-certificate"></i> Sertifikat</a></li>
  </ul>
</nav>

<!-- KONTEN -->
<div class="container">
  <div class="icon-big">🏆</div>
  <h1 class="title">Sertifikat Saya</h1>
  <p class="subtitle">Bukti Perjalanan Belajar</p>

  <div class="slider-box">
    <div class="main-img">
      <button class="arrow prev" id="prevBtn"><i class="fas fa-chevron-left"></i></button>
      <img src="https://i.imgur.com/2fOeWHS.jpg" alt="Sertifikat" id="mainImg">
      <button class="arrow next" id="nextBtn"><i class="fas fa-chevron-right"></i></button>
    </div>

    <div class="info">
      <h3>
        <span class="num" id="num">#01</span>
        <span id="title">Memuat...</span>
      </h3>
      <p id="desc">Memuat deskripsi...</p>
    </div>

    <div class="counter" id="counter">01 / 08</div>
    <div class="thumbs" id="thumbs"></div>
  </div>

  <div class="page-nav">
    <a href="motto.html"><i class="fas fa-arrow-left"></i> Motto</a>
    <a href="index.html"><i class="fas fa-home"></i> Home</a>
  </div>
</div>

<script>
/* ============================================
   DATA SERTIFIKAT — EDIT DI SINI
   ============================================ */
const data = [
  {
    img: 'https://i.imgur.com/2fOeWHS.jpg',
    title: 'Judul Sertifikat 1',
    desc: 'Deskripsi sertifikat 1 — ganti dengan penjelasan kamu.'
  },
  {
    img: 'https://i.imgur.com/ot2pabx.jpg',
    title: 'Judul Sertifikat 2',
    desc: 'Deskripsi sertifikat 2 — ganti dengan penjelasan kamu.'
  },
  {
    img: 'https://i.imgur.com/j3hujjM.jpg',
    title: 'Judul Sertifikat 3',
    desc: 'Deskripsi sertifikat 3 — ganti dengan penjelasan kamu.'
  },
  {
    img: 'https://i.imgur.com/UY3nDvS.jpg',
    title: 'Judul Sertifikat 4',
    desc: 'Deskripsi sertifikat 4 — ganti dengan penjelasan kamu.'
  },
  {
    img: 'https://i.imgur.com/DeCPUWx.jpg',
    title: 'Judul Sertifikat 5',
    desc: 'Deskripsi sertifikat 5 — ganti dengan penjelasan kamu.'
  },
  {
    img: 'https://i.imgur.com/KCppUoo.jpg',
    title: 'Judul Sertifikat 6',
    desc: 'Deskripsi sertifikat 6 — ganti dengan penjelasan kamu.'
  },
  {
    img: 'https://i.imgur.com/C7FZAbZ.jpg',
    title: 'Judul Sertifikat 7',
    desc: 'Deskripsi sertifikat 7 — ganti dengan penjelasan kamu.'
  },
  {
    img: 'https://i.imgur.com/NlCjlDB.jpg',
    title: 'Judul Sertifikat 8',
    desc: 'Deskripsi sertifikat 8 — ganti dengan penjelasan kamu.'
  }
];

let idx = 0;
const mainImg = document.getElementById('mainImg');
const titleEl = document.getElementById('title');
const descEl = document.getElementById('desc');
const numEl = document.getElementById('num');
const counterEl = document.getElementById('counter');
const thumbsEl = document.getElementById('thumbs');

/* Bikin thumbnail */
data.forEach(function(item, i) {
  const t = document.createElement('div');
  t.className = 'thumb' + (i === 0 ? ' active' : '');
  t.innerHTML = '<img src="' + item.img + '">';
  t.onclick = function() { go(i); };
  thumbsEl.appendChild(t);
});
const thumbs = document.querySelectorAll('.thumb');

/* Ganti slide */
function go(i) {
  if (i < 0) i = data.length - 1;
  if (i >= data.length) i = 0;
  if (i === idx) return;

  mainImg.classList.add('fade');

  setTimeout(function() {
    mainImg.src = data[i].img;
    titleEl.textContent = data[i].title;
    descEl.textContent = data[i].desc;
    numEl.textContent = '#' + String(i + 1).padStart(2, '0');
    counterEl.textContent = String(i + 1).padStart(2, '0') + ' / ' + String(data.length).padStart(2, '0');

    thumbs.forEach(function(t, x) { t.classList.toggle('active', x === i); });
    idx = i;

    setTimeout(function() { mainImg.classList.remove('fade'); }, 50);
  }, 250);
}

document.getElementById('prevBtn').onclick = function() { go(idx - 1); };
document.getElementById('nextBtn').onclick = function() { go(idx + 1); };

/* Keyboard */
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft') go(idx - 1);
  if (e.key === 'ArrowRight') go(idx + 1);
});

/* Init info awal */
titleEl.textContent = data[0].title;
descEl.textContent = data[0].desc;
numEl.textContent = '#01';
counterEl.textContent = '01 / ' + String(data.length).padStart(2, '0');

/* Bintang */
const sky = document.getElementById('sky');
for (let i = 0; i < 120; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2.5 + 1;
  s.style.width = size + 'px';
  s.style.height = size + 'px';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 100 + '%';
  s.style.animationDuration = (Math.random() * 3 + 1.5) + 's';
  s.style.animationDelay = (Math.random() * 4) + 's';
  sky.appendChild(s);
}
</script>

</body>
</html>
